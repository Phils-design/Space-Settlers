# Netlify hosting for the game (its own site, so it can reach the feedback console).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The built scripts have hashed names, so they can be cached for good; the page itself is always re-checked.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
